<!doctype html>
<html><head><meta charset="utf-8"><title>maitred</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font:14px -apple-system,sans-serif;background:#0d1117;color:#e6edf3;max-width:760px;margin:2rem auto;padding:0 1rem}
  h1{font-size:1.4rem} h2{font-size:1.05rem;margin-top:2rem}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
  .alert{border-color:#3fb950}
  .ask{border-color:#d29922}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#30363d}
  .matched{background:#23863633;color:#7ee787} .watching{background:#1f6feb33;color:#79b8ff}
  .note{color:#7d8590;font-size:12px;margin-top:.4rem;white-space:pre-wrap;word-break:break-word}
  .line{margin:.5rem 0;white-space:pre-wrap;word-break:break-word}
  .who{color:#7d8590;font-size:12px}
  .tool{color:#7d8590;font-size:12px}
  form{display:flex;gap:.5rem}
  textarea{flex:1;min-height:3rem}
  textarea,button{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;font:inherit}
  button{cursor:pointer} button:hover{border-color:#8b949e}
</style></head><body>
<h1>maitred</h1>
<div id="status" class="note"></div>
<div id="watches"></div>

<h2>conversation</h2>
<div id="transcript" class="card"></div>
<div id="pending"></div>
<form id="f"><textarea id="text" placeholder="table for 2 at guerilla diner"></textarea><button>send</button></form>

<h2>recipes</h2>
<div id="recipes" class="card note"></div>

<h2>details it may type without asking</h2>
<div id="typing" class="card"></div>

<script>
const TOKEN = "__MAITRED_TOKEN__";
async function api(path, body) {
  const r = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "x-maitred-token": TOKEN, "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const value = await r.json();
  if (!r.ok) throw new Error(value.error || r.status);
  return value;
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function button(label, onclick) {
  const b = el("button", "", label);
  b.onclick = onclick;
  return b;
}
function render(s) {
  document.getElementById("status").textContent =
    (s.model || "no model configured") +
    (Object.keys(s.pending).length ? " · waiting for your approval" : s.busy ? " · working" : "") +
    (s.failure ? " · last run failed: " + s.failure : "");

  const pending = document.getElementById("pending");
  pending.replaceChildren(...Object.entries(s.pending).map(([id, p]) => {
    const card = el("div", "card ask");
    card.append(el("div", "", p.question));
    card.append(el("div", "note", p.detail));
    const row = el("form");
    row.append(button("approve", (ev) => { ev.preventDefault(); api("/api/decide", { id, allow: true }).then(refresh); }));
    row.append(button("decline", (ev) => { ev.preventDefault(); api("/api/decide", { id, allow: false }).then(refresh); }));
    card.append(row);
    return card;
  }));

  const watches = document.getElementById("watches");
  watches.replaceChildren(...Object.entries(s.watches).reverse().map(([id, w]) => {
    const card = el("div", "card" + (w.state === "matched" ? " alert" : ""));
    const head = el("div", "", w.label + " ");
    head.append(el("span", "pill " + w.state, w.state));
    card.append(head);
    if (w.state === "matched") card.append(el("div", "line", w.alert + "\n" + JSON.stringify(w.matches)));
    if (w.unproven) card.append(el("div", "line", "Unproven, may be blind: " + w.unproven));
    card.append(el("div", "note",
      "every " + w.intervalSeconds + "s · " + w.probes + " probes · last " + new Date(w.lastProbedAt).toLocaleString() + " · " + w.note));
    if (w.state === "watching") {
      const row = el("form");
      row.append(button("stop", (ev) => { ev.preventDefault(); api("/api/watch/stop", { id }).then(refresh); }));
      card.append(row);
    }
    return card;
  }));

  const transcript = document.getElementById("transcript");
  transcript.replaceChildren(...(s.transcript.length ? s.transcript : [{ who: "", text: "nothing yet" }]).map((l) => {
    if (l.who === "tool") return el("div", "tool", "· " + l.text);
    const line = el("div", "line");
    line.append(el("div", "who", l.who));
    line.append(el("div", "", l.text));
    return line;
  }));

  document.getElementById("recipes").textContent =
    s.recipes.length ? s.recipes.map((r) => r.name + ": " + r.action).join("\n") : "none yet";

  const typing = Object.entries(s.typing);
  document.getElementById("typing").replaceChildren(...(typing.length ? typing.map(([site, labels]) => {
    const row = el("div", "line");
    row.append(el("div", "", site + ": " + labels.join(", ")));
    const form = el("form");
    form.append(button("forget", (ev) => { ev.preventDefault(); api("/api/typing/forget", { site }).then(refresh); }));
    row.append(form);
    return row;
  }) : [el("div", "note", "none")]));
}
let shown = "";
async function refresh() {
  try {
    const s = await api("/api/state");
    const next = JSON.stringify(s);
    if (next !== shown) { shown = next; render(s); }
  } catch (e) {
    document.getElementById("status").textContent = "error: " + e.message;
  }
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const box = document.getElementById("text");
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  try { await api("/api/message", { text }); } catch (e) { document.getElementById("status").textContent = "error: " + e.message; }
  refresh();
});
refresh();
setInterval(refresh, 2000);
</script>
</body></html>
