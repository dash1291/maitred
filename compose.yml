services:
  maitred:
    build: .
    image: maitred:latest
    container_name: maitred
    # state on a bind mount, owned by uid 1000 (dev) on the host
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./state:/maitred/state
    # console on host loopback ONLY — reach it via ssh -L, never from the net
    environment:
      - MAITRED_WEB_BIND=0.0.0.0
    ports:
      - "127.0.0.1:8681:8681"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
